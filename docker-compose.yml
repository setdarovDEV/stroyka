version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stroyka-postgres
    environment:
      POSTGRES_DB: stroyka
      POSTGRES_USER: stroyka
      POSTGRES_PASSWORD: stroyka123
    ports:
      - "5433:5432"
    volumes:
      - stroyka-pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: stroyka-backend
    environment:
      DATABASE_URL: postgresql://stroyka:stroyka123@postgres:5432/stroyka?schema=public
      JWT_SECRET: stroyka-secret-key-change-in-production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    command: ["bun", "run", "start:prod"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://169.58.63.34:3001
    container_name: stroyka-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  stroyka-pgdata:
